services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://regs:password@db:5432/regs
      PRIVATE_KEY_PATH: /app/keys/private.pem
      PUBLIC_KEY_PATH: /app/keys/public.pem
      DOCKER_IMAGE: yhlib/cs3060701
      MAX_CONCURRENT_JOBS: "3"
      TIME_LIMIT_SECONDS: "10"
      STORAGE_PATH: /app/storage
      # HOST_STORAGE_PATH must be the absolute path on your HOST machine.
      # Example: HOST_STORAGE_PATH=/home/user/backend_final/storage
      HOST_STORAGE_PATH: ${HOST_STORAGE_PATH}
    volumes:
      - ./storage:/app/storage
      - ./keys:/app/keys
      # Docker-out-of-Docker: share host's Docker socket so the app can spawn judge containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: regs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
